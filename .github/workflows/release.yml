name: Deploy and Release Plugin

on:
  push:
    tags:
      - 'v*' # Triggert zodra je een tag pusht die begint met 'v', bijvoorbeeld v1.0.0

permissions:
  contents: write

jobs:
  build_release:
    name: Create WordPress Plugin Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build WordPress Plugin Zip
        run: |
          # 1. Maak een tijdelijke map aan met de juiste plugin-slugnaam
          mkdir -p remote-tickets-server-addons

          # 2. Kopieer de specifieke bestanden en mappen met de juiste naam
          cp -r src remote-tickets-server-addons/
          cp remote-tickets-server-addons.php remote-tickets-server-addons/
          cp readme.txt remote-tickets-server-addons/
          cp .editorconfig remote-tickets-server-addons/ 2>/dev/null || true

          # 3. Zip de map (sluit eventuele dev-notes en verborgen git-bestanden uit)
          zip -r remote-tickets-server-addons.zip remote-tickets-server-addons -x "*.git*" "remote-tickets-server-addons/dev-notes/*"

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Gebruik de ingebouwde GitHub CLI om de release aan te maken en de zip te koppelen
          gh release create ${{ github.ref_name }} remote-tickets-server-addons.zip \
            --title "${{ github.ref_name }}" \
            --generate-notes
